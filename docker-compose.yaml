services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${MAESTRO_DATABASE_USER}
      POSTGRES_PASSWORD: ${MAESTRO_DATABASE_PASSWORD}
      POSTGRES_DB: ${MAESTRO_DATABASE_DB}

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${MAESTRO_PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${MAESTRO_DATABASE_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - 8090:80
    depends_on:
      - postgres
volumes:
  postgres_data:
  pgadmin-data: